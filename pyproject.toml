[project]
name = "workbench"
version = "0.1.0"
authors = [{name = "Florian Hofmann", email = "flo.hofmann@uni-tuebingen.de"}]
description = "Workstation for phd project analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bokeh>=3.8.1",
    "fastexcel>=0.20.2",
    "fastparquet>=2024.11.0",
    "gitpython>=3.1.44",
    "h5df>=0.1.5",
    "hdf5storage>=0.2.2",
    "holoviews>=1.21.0",
    "hvplot>=0.12.1",
    "ipykernel>=6.29.5",
    "ipython>=9.3.0",
    "jax>=0.8.2",
    "jupyter>=1.1.1",
    "jupyter-bokeh>=4.0.5",
    "keyboard>=0.13.5",
    "mat73>=0.65",
    "matplotlib>=3.10.3",
    "maturin>=1.10.2",
    "numpy>=2.3.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.0",
    "panel>=1.8.2",
    "parquet>=1.3.1",
    "pathlib>=1.0.1",
    "polars>=1.30.0",
    "pyaml>=25.7.0",
    "pyarrow>=22.0.0",
    "pyqt6>=6.9.1",
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "scikit-learn>=1.7.0",
    "scikit-posthocs>=0.12.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "serial>=0.0.97",
    "tables>=3.10.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workbench"]
py-modules = ["__init__"]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cu128"}
torchvision = {index = "pytorch-cu128"}
